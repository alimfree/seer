<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Signature gradient: primary to primary_container at 135deg -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000B13"/>
      <stop offset="100%" stop-color="#002434"/>
    </linearGradient>
    <!-- Subtle light glow top-right for depth -->
    <radialGradient id="glow" cx="85%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#0A3A4F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <!-- Tertiary accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B3111"/>
      <stop offset="100%" stop-color="#7A5A2E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle geometric accent: thin lines for clinical precision -->
  <line x1="100" y1="0" x2="100" y2="630" stroke="#0A3A4F" stroke-width="0.5" opacity="0.3"/>
  <line x1="1100" y1="0" x2="1100" y2="630" stroke="#0A3A4F" stroke-width="0.5" opacity="0.3"/>

  <!-- Top accent bar -->
  <rect x="100" y="80" width="64" height="3" fill="url(#accent)" rx="1.5"/>

  <!-- Brand name -->
  <text x="100" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="300" fill="#F8F9FF" letter-spacing="-1">
    Seer Mobility
  </text>

  <!-- Divider line -->
  <rect x="100" y="195" width="180" height="1.5" fill="#4B3111" opacity="0.7" rx="0.75"/>

  <!-- Headline / Value prop -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="300" fill="#DDE2EE" letter-spacing="-0.5">
    <tspan x="100" y="270">Get paid faster for</tspan>
    <tspan x="100" y="320">every NEMT trip.</tspan>
  </text>

  <!-- Subheadline -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#8A9BB5" letter-spacing="0.3">
    <tspan x="100" y="390">Clean claim submission. Active denial management.</tspan>
    <tspan x="100" y="420">Built for NEMT operators.</tspan>
  </text>

  <!-- Bottom accent bar -->
  <rect x="100" y="565" width="40" height="3" fill="url(#accent)" rx="1.5"/>

  <!-- Domain / URL -->
  <text x="1100" y="575" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5A7080" text-anchor="end" letter-spacing="2">seermobility.com</text>
</svg>
